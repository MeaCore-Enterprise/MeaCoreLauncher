name: Release

# Un único workflow publica la release. Antes, build-windows.yml creaba un draft y
# build-linux.yml esperaba hasta 450 s a que existiera para adjuntarse: si el job de Linux
# ganaba la carrera, se publicaba una release solo con el .deb y el .exe se quedaba
# colgado en un draft. Aquí ambos artefactos se construyen en paralelo y los publica
# UN solo job, que solo corre si los dos builds terminaron bien.

on:
  push:
    tags:
      - "v*"
      - "bat-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a re-construir (ej: v1.5.0)"
        required: true

# Un solo run por tag a la vez: dos builds del mismo tag no pueden publications cruzadas.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      # Que un fallo en un sistema no cancele el otro: lo decide el job de publicación.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: Windows (.exe)
          - os: ubuntu-latest
            target: Linux (.deb)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Inject Supabase Secrets
        shell: pwsh
        run: |
          "supabase.url=${{ secrets.SUPABASE_URL }}" | Out-File -FilePath secrets.properties -Encoding utf8
          "supabase.key=${{ secrets.SUPABASE_KEY }}" | Out-File -FilePath secrets.properties -Encoding utf8 -Append
          Write-Host "Secrets injected into secrets.properties"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build Gradle (Skip Tests)
        shell: pwsh
        run: ./gradlew build --no-daemon -x test

      # jpackage exige una versión numérica con al menos dos componentes (X.Y), así que
      # los sufijos -alpha/-alfa se quitan igual que en Windows.
      - name: Extract Version
        shell: pwsh
        run: |
          $raw = (Get-Content src/main/resources/version.properties |
                  Select-String "^version=").ToString().Split("=",2)[1].Trim()
          $clean = $raw -replace "-alpha","" -replace "-alfa","" -replace "-preview",""
          if ($clean -notmatch "^\d+\.\d+") { $clean = "$clean.0" }
          "VERSION=$clean" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Launcher version: $clean"

      # ── Windows ──────────────────────────────────────────────────────────────
      - name: Convert icon PNG -> ICO
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # ImageMagick 7 en windows-latest se llama 'magick', no 'convert'
          magick icon.png -resize 256x256 icon.ico

      - name: Add Inno Setup to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $innoPath = "C:\Program Files (x86)\Inno Setup 6"
          if (-not (Test-Path $innoPath)) {
              Write-Host "Inno Setup no encontrado, instalando con Chocolatey..."
              choco install innosetup -y --no-progress
          }
          Add-Content -Path $env:GITHUB_PATH -Value $innoPath

      - name: Create .exe with jpackage
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/dist | Out-Null

          $javaHome = $env:JAVA_HOME_21_X64
          if (-not $javaHome) { $javaHome = $env:JAVA_HOME }
          if (-not $javaHome) {
              $javaHome = ((java -XshowSettings:properties -version 2>&1) |
                           Select-String 'java.home = (.+)' |
                           ForEach-Object { $_.Matches.Groups[1].Value.Trim() })
          }

          $modulePath = "$javaHome\jmods"
          if (-not (Test-Path $modulePath)) {
              Write-Error "Module path not found: $modulePath"
              Write-Host "JAVA_HOME: $javaHome"
              exit 1
          }

          $MainJar = (Get-ChildItem -Filter "meacore-launcher-*.jar" -Path build/libs |
                      Select-Object -First 1).Name
          Write-Host "Main JAR: $MainJar"

          jpackage `
            --module-path "$modulePath" `
            --name "MeaCore Launcher" `
            --app-version "$env:VERSION" `
            --vendor "MeaCore-Enterprise" `
            --input build/libs `
            --main-jar $MainJar `
            --main-class com.experimento.launcher.Main `
            --type exe `
            --icon icon.ico `
            --win-shortcut `
            --win-menu `
            --win-dir-chooser `
            --win-per-user-install `
            --java-options "-Xmx512m" `
            --java-options "--add-opens=java.base/java.lang=ALL-UNNAMED" `
            --java-options "-Dfile.encoding=UTF-8" `
            --dest build/dist

          # Nombre estable: es el que busca el AutoUpdateService.
          $exe = Get-ChildItem -Filter "*.exe" -Path build/dist | Select-Object -First 1
          Rename-Item $exe.FullName "meacore-launcher-$env:VERSION.exe"

      # ── Linux ────────────────────────────────────────────────────────────────
      - name: Install ImageMagick
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing imagemagick

      - name: Resize Icons
        if: runner.os == 'Linux'
        run: |
          convert icon.png -resize 48x48   icon-48.png
          convert icon.png -resize 128x128 icon-128.png
          convert icon.png -resize 256x256 icon-256.png
          cp icon-48.png  src/main/resources/com/experimento/launcher/ui/
          cp icon-128.png src/main/resources/com/experimento/launcher/ui/
          cp icon-256.png src/main/resources/com/experimento/launcher/ui/

      - name: Create .deb with jpackage
        if: runner.os == 'Linux'
        run: |
          mkdir -p build/dist
          MAIN_JAR=$(ls build/libs/meacore-launcher-*.jar | head -n 1)
          JAR_NAME=$(basename $MAIN_JAR)
          jpackage --name "MeaCore Launcher" \
            --linux-package-name meacore-launcher \
            --vendor "MeaCore-Enterprise" \
            --app-version "$VERSION" \
            --input build/libs \
            --main-jar $JAR_NAME \
            --main-class com.experimento.launcher.Main \
            --type deb \
            --icon icon-256.png \
            --linux-shortcut \
            --linux-app-category Game \
            --java-options "-Xmx512m" \
            --java-options "--add-opens=java.base/java.lang=ALL-UNNAMED" \
            --java-options "-Dfile.encoding=UTF-8" \
            --dest build/dist

      - name: Patch .desktop file
        if: runner.os == 'Linux'
        run: |
          DEB=$(ls build/dist/*.deb)
          mkdir -p /tmp/debpatch
          dpkg-deb -R $DEB /tmp/debpatch
          # Buscar SOLO el .desktop de la aplicación, ignorando los de legal/runtime
          DESKTOP=$(find /tmp/debpatch/opt -maxdepth 3 -name "*.desktop" | head -n 1)
          echo "Parcheando: $DESKTOP"
          {
            echo "[Desktop Entry]"
            echo "Name=MeaCore Launcher"
            echo "Comment=Tu plataforma definitiva para inyectar mods de Minecraft"
            echo 'Exec="/opt/meacore-launcher/bin/MeaCore Launcher"'
            echo "Icon=/opt/meacore-launcher/lib/MeaCore_Launcher.png"
            echo "Terminal=false"
            echo "Type=Application"
            echo "Categories=Game"
            echo "MimeType="
            echo "StartupWMClass=com.experimento.launcher.LauncherApp"
          } > "$DESKTOP"
          dpkg-deb -b /tmp/debpatch $DEB

      - name: Verify artifact exists
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path build/dist -Include *.exe,*.deb -Recurse)
          if ($files.Count -eq 0) { Write-Error "No se generó ningún instalador"; exit 1 }
          $files | ForEach-Object { Write-Host "$($_.Name) - $([math]::Round($_.Length/1MB,2)) MB" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: build/dist/*
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────────────────
  # Publicación: un solo job, después de los dos builds.
  # ─────────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # El job solo descarga artefactos, pero necesita scripts/ para decidir si la tag es
      # una pre-release: es la regla que evita que una RC llegue a /releases/latest.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: installer-*
          merge-multiple: true

      - name: List downloaded assets
        run: ls -lh dist

      - name: Generate latest.json
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess

          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          dist = pathlib.Path("dist")
          assets = []
          for f in sorted(dist.iterdir()):
              if f.name == "latest.json" or f.suffix not in (".exe", ".deb"):
                  continue
              h = hashlib.sha256()
              with f.open("rb") as fh:
                  for chunk in iter(lambda: fh.read(1024 * 1024), b""):
                      h.update(chunk)
              assets.append({
                  "name": f.name,
                  "browser_download_url":
                      f"https://github.com/{repo}/releases/download/{tag}/{f.name}",
                  "size": f.stat().st_size,
                  # Calculado aquí, sobre el binario recién construido: no depende de que
                  # GitHub rellene el campo digest de la API.
                  "digest": "sha256:" + h.hexdigest(),
              })

          if not assets:
              raise SystemExit("::error::No hay instaladores para latest.json")

          payload = {"tag_name": tag, "assets": assets}
          (dist / "latest.json").write_text(json.dumps(payload, indent=2) + "\n")
          print(json.dumps(payload, indent=2))
          PY

      - name: Create or complete the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # latest.json va con los instaladores: es el manifest que lee el Worker y sin él
          # el launcher vuelve a depender de la API de GitHub (60 peticiones/hora sin token).
          assets=(dist/*.exe dist/*.deb dist/latest.json)

          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::No hay instaladores que publicar"
            exit 1
          fi
          if [ ! -f dist/latest.json ]; then
            echo "::error::Falta dist/latest.json (el paso 'Generate latest.json' no lo produjo)"
            exit 1
          fi

          # Una tag con sufijo de pre-release (v1.6.2-rc.1) NO debe publicarse como estable:
          # /releases/latest y releases/latest ignoran pre-releases, asi que marcarla es lo
          # unico que impide que todos los usuarios reciban una RC.
          if scripts/is-prerelease-tag.sh "$TAG"; then
            prerelease_flag="--prerelease"
          else
            prerelease_flag=""
          fi

          state=$(gh release view "$TAG" --json isDraft -q '.isDraft' 2>/dev/null || echo "none")

          case "$state" in
            none)
              # Draft primero: la release solo se publica cuando contiene los DOS
              # instaladores, así que nunca se publica una release a medias.
              echo "Creando draft para $TAG"
              gh release create "$TAG" --draft $prerelease_flag --generate-notes --title "MeaCore Launcher $TAG"
              gh release upload "$TAG" "${assets[@]}" --clobber
              ;;
            true)
              echo "El release $TAG ya existía como draft: se completan los assets"
              gh release upload "$TAG" "${assets[@]}" --clobber
              # gh release edit necesita true/false explicitos: --prerelease sin valor no es valido.
              if [ -n "$prerelease_flag" ]; then
                gh release edit "$TAG" --prerelease=true
              else
                gh release edit "$TAG" --prerelease=false
              fi
              ;;
            *)
              # Release ya publicado (re-ejecución manual): NO se borra ni se recrea,
              # para no perder su ID, su fecha de publicación ni el historial.
              echo "El release $TAG ya está publicado: solo se suben los assets que falten"
              gh release upload "$TAG" "${assets[@]}" --clobber
              exit 0
              ;;
          esac

      - name: Verify both installers are attached
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          echo "Assets del release $TAG:"
          gh release view "$TAG" --json assets -q '.assets[] | "  \(.name) - \(.size) bytes"'

          exe=$(gh release view "$TAG" --json assets -q '[.assets[] | select(.name | endswith(".exe"))] | length')
          deb=$(gh release view "$TAG" --json assets -q '[.assets[] | select(.name | endswith(".deb"))] | length')
          manifest=$(gh release view "$TAG" --json assets -q '[.assets[] | select(.name == "latest.json")] | length')

          if [ "$exe" -lt 1 ] || [ "$deb" -lt 1 ] || [ "$manifest" -lt 1 ]; then
            echo "::error::Falta .exe ($exe), .deb ($deb) o latest.json ($manifest). No se publica."
            exit 1
          fi

          # Solo ahora se publica: hay .exe, .deb y manifest verificados.
          # Defense in depth: si la tag es pre-release pero el release quedó como estable,
          # /releases/latest lo ofrecería a todos los usuarios. Better que falle el CI.
          if scripts/is-prerelease-tag.sh "$TAG"; then
            is_pre=$(gh release view "$TAG" --json isPrerelease -q '.isPrerelease')
            [ "$is_pre" = "true" ] || { echo "::error::$TAG es una pre-release pero se creó como estable: /releases/latest la ofrecería a todos los usuarios"; exit 1; }
            echo "Release $TAG publicado como PRERELEASE: /releases/latest la ignora (los usuarios siguen viendo la estable)"
          fi

          gh release edit "$TAG" --draft=false
          echo "Release $TAG publicado con ambos instaladores y latest.json"