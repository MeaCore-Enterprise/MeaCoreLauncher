name: Release Linux Installer

concurrency:
  group: release-linux-${{ github.ref_name }}

on:
  push:
    tags:
      - "bat-*"
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a re-construir (ej: v1.5.0)"
        required: true

permissions:
  contents: write

jobs:
  build-linux:
    name: Build .deb (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Inject Supabase Secrets
        run: |
          echo "supabase.url=${{ secrets.SUPABASE_URL }}" > secrets.properties
          echo "supabase.key=${{ secrets.SUPABASE_KEY }}" >> secrets.properties

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build Gradle (Skip Tests)
        run: ./gradlew build --no-daemon -x test

      - name: Extract Version
        id: vars
        run: |
          VERSION=$(grep 'version=' src/main/resources/version.properties | cut -d'=' -f2 | sed 's/-alpha//' | sed 's/-alfa//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y --fix-missing imagemagick

      - name: Resize Icons
        run: |
          convert icon.png -resize 48x48   icon-48.png
          convert icon.png -resize 128x128 icon-128.png
          convert icon.png -resize 256x256 icon-256.png
          cp icon-48.png  src/main/resources/com/experimento/launcher/ui/
          cp icon-128.png src/main/resources/com/experimento/launcher/ui/
          cp icon-256.png src/main/resources/com/experimento/launcher/ui/

      - name: Create .deb with jpackage
        run: |
          mkdir -p build/dist
          MAIN_JAR=$(ls build/libs/meacore-launcher-*.jar | head -n 1)
          JAR_NAME=$(basename $MAIN_JAR)
          jpackage --name "MeaCore Launcher" \
            --linux-package-name meacore-launcher \
            --vendor "MeaCore" \
            --app-version "$VERSION" \
            --input build/libs \
            --main-jar $JAR_NAME \
            --main-class com.experimento.launcher.Main \
            --type deb \
            --icon icon-256.png \
            --linux-shortcut \
            --linux-app-category Game \
            --java-options "-Xmx512m" \
            --java-options "--add-opens=java.base/java.lang=ALL-UNNAMED" \
            --java-options "-Dfile.encoding=UTF-8" \
            --dest build/dist

      - name: Inspect .deb contents
        run: dpkg -c build/dist/*.deb | grep desktop

      - name: Patch .desktop file
        run: |
          DEB=$(ls build/dist/*.deb)
          mkdir -p /tmp/debpatch
          dpkg-deb -R $DEB /tmp/debpatch
          # Buscar SOLO el .desktop de la aplicación, ignorando los de legal/runtime
          DESKTOP=$(find /tmp/debpatch/opt -maxdepth 3 -name "*.desktop" | head -n 1)
          echo "Parcheando: $DESKTOP"
          {
            echo "[Desktop Entry]"
            echo "Name=MeaCore Launcher"
            echo "Comment=Tu plataforma definitiva para inyectar mods de Minecraft"
            echo 'Exec="/opt/meacore-launcher/bin/MeaCore Launcher"'
            echo "Icon=/opt/meacore-launcher/lib/MeaCore_Launcher.png"
            echo "Terminal=false"
            echo "Type=Application"
            echo "Categories=Game"
            echo "MimeType="
            echo "StartupWMClass=com.experimento.launcher.LauncherApp"
          } > "$DESKTOP"
          dpkg-deb -b /tmp/debpatch $DEB

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeaCoreLauncher-Linux
          path: build/dist/*.deb

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          $files = "build/dist/*.deb"

          # Esperar a que el release sea creado por Windows (como draft)
          Write-Host "Esperando a que el job de Windows cree el release draft para $tag..."
          $attempts = 0
          $found = $false
          while ($attempts -lt 45) {
            $ErrorActionPreference = 'SilentlyContinue'
            $releaseId = gh release view $tag --json id -q '.id' 2>$null
            $ErrorActionPreference = 'Stop'
            if ($LASTEXITCODE -eq 0 -and $releaseId) {
              Write-Host "¡Release draft encontrado!"
              $found = $true
              break
            }
            Start-Sleep 10
            $attempts++
          }

          if ($found) {
            # Subir el asset .deb al release draft
            Write-Host "Subiendo asset Linux al release draft..."
            gh release upload $tag $files --clobber
            
            # Publicar el release draft
            Write-Host "Publicando el release final..."
            gh release edit $tag --draft=false
          } else {
            # Fallback: si Windows no lo creó en 450 segundos, lo creamos directamente
            Write-Host "No se encontró el release de Windows. Creándolo de forma directa..."
            gh release delete $tag --yes 2>$null
            Start-Sleep 3
            gh release create $tag $files --generate-notes --title "MeaCore Launcher $tag"
          }
